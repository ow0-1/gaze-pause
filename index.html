<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视线暂停学习器</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 800px;
      background: #000;
    }

    button,
    input {
      font-size: 18px;
      margin: 8px 0;
    }

    #camVideo {
      width: 200px;
      border: 2px solid #0a0;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <h1>📚 视线暂停学习器</h1>

  <input type="file" id="fileInput" accept="video/*">
  <br>

  <!-- 学习视频 -->
  <video id="lessonVideo" playsinline controls></video>
  <br>

  <!-- 摄像头（只保留这一个，属性写全：muted + playsinline + autoplay 兜底） -->
  <button id="startCam">🎥 开始视线检测</button>
  <video id="camVideo" playsinline muted autoplay></video>

  <script>
    // 选视频播放
    const fileInput = document.getElementById('fileInput')
    const lessonVideo = document.getElementById('lessonVideo')

    fileInput.onchange = function () {
      const file = fileInput.files[0]
      lessonVideo.src = URL.createObjectURL(file)
      lessonVideo.play().catch(() => { })
    }

    // 按钮开摄像头（修复版）
    document.getElementById('startCam').addEventListener('click', async () => {
      try {
        // 电脑调试用 video: true，iPad 后续可改回 facingMode: 'user'
        const stream = await navigator.mediaDevices.getUserMedia({video: true})
        const camVideo = document.getElementById('camVideo')

        camVideo.srcObject = stream

        // 关键：显式调用 play()，黑屏救星
        await camVideo.play()

        alert('✅ 摄像头开了，应该有画面了！')
      } catch (e) {
        alert('❌ 失败: ' + e.name + '\n' + e.message)
      }
    })
  </script>
</body>

</html>
