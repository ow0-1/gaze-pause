<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>视线检测 - 本地托管版</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    video,
    canvas {
      max-width: 100%;
      border: 1px solid #ccc;
      display: block;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #log {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h2>视线检测 (本地托管)</h2>
  <button id="startBtn">1. 开摄像头并检测</button>
  <div id="status">等待...</div>
  <video id="camVideo" autoplay playsinline muted></video>
  <div id="log"></div>

  <script type="module">
    let vision;
    const log = (msg) => {
      console.log(msg);
      document.getElementById('log').innerText += msg + '\n';
    };

    // 1. 动态导入本地 JS (已重命名为 .js)
    try {
      vision = await import('./mp/vision_bundle.js');
      log('✅ vision 本地加载成功 (MIME问题已解决)');
    } catch (e) {
      console.error(e);
      log('❌ vision 加载失败: ' + e.message);
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      if (!vision) {log('vision 未就绪'); return;}
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      log('正在开启摄像头...');

      try {
        // 2. 开摄像头
        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}, audio: false});
        const cam = document.getElementById('camVideo');
        cam.srcObject = stream;
        await cam.play();
        log('✅ 摄像头已开，加载 WASM 与模型...');

        // 3. 加载本地 WASM
        const filesetResolver = await vision.FilesetResolver.forVisionTasks("./mp/wasm");

        // 4. 加载本地模型
        const faceLandmarker = await vision.FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: "./mp/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO"
        });
        log('✅ 模型就绪，开始检测 (寻找 478 关键点)...');

        // 5. 检测循环
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let frame = 0, last = 0;

        function loop() {
          if (cam.readyState >= 2) {
            canvas.width = cam.videoWidth;
            canvas.height = cam.videoHeight;
            ctx.drawImage(cam, 0, 0);
            const res = faceLandmarker.detectForVideo(canvas, performance.now());
            frame++;
            const now = Date.now();
            if (now - last > 2000) {
              if (res.faceLandmarks && res.faceLandmarks.length > 0) {
                const lm = res.faceLandmarks[0];
                log(`帧#${frame} | ✅ 检测到人脸 | ${lm.length} 关键点`);
              } else {
                log(`帧#${frame} | ❌ 未检测到人脸`);
              }
              last = now;
            }
          }
          requestAnimationFrame(loop);
        }
        loop();
      } catch (e) {
        console.error(e);
        log('❌ 错误: ' + e.message);
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
